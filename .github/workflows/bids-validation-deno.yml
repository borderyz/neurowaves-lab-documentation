name: BIDS validate (Box via Python + Deno)

on:
  workflow_dispatch:
    inputs:
      box_folder_id:
        description: "Box folder ID containing dataset subfolders"
        required: true
        default: "258911132863"
      create_placeholders:
        description: "Create zero-byte large file placeholders (true/false)"
        required: true
        default: "true"
  pull_request: {}
  schedule:
    - cron: "0 20 * * *"

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compute effective config
        id: cfg
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BOX_ID="${{ github.event.inputs.box_folder_id }}"
            PLACEHOLDERS="${{ github.event.inputs.create_placeholders }}"
          else
            BOX_ID="258911132863"
            PLACEHOLDERS="true"
          fi
          echo "box_folder_id=$BOX_ID" >> "$GITHUB_OUTPUT"
          echo "create_placeholders=$PLACEHOLDERS" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install "boxsdk[jwt]==3.14.0" pandas

      - name: Set up Deno (latest)
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      # Optional but speeds things up by caching the validator module ahead of time
      - name: Pre-cache BIDS validator (Deno)
        run: deno cache -R jsr:@bids/validator

      - name: Show versions
        run: |
          python -c "import sys; print(sys.version)"
          deno --version

      - name: Run validation script (Deno preferred)
        env:
          BOX_CLIENT_SDK_CONFIG: ${{ secrets.BOX_CLIENT_SDK_CONFIG }}
          PYTHONUNBUFFERED: "1"
          USE_DENO: "1"   # force Deno path
        run: |
          python .github/workflows/validate_box_deno.py \
            --box-folder-id "${{ steps.cfg.outputs.box_folder_id }}" \
            --work-dir datasets \
            --skip-ext .con \
            --skip-ext .fif \
            --skip-ext .mrk \
            --skip-ext .bin \
            --skip-ext .meg4 \
            --skip-ext .ds \
            --skip-ext .dat \
            --skip-ext .mat \
            --skip-ext .edf \
            --skip-ext .mgz \
            --skip-ext .nii \
            --skip-ext .nii.gz
