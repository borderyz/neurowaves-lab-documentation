name: BIDS validate (Box via Python)

on:
  workflow_dispatch:
    inputs:
      box_folder_id:
        description: "Box folder ID containing dataset subfolders"
        required: true
        default: "258911132863"
      create_placeholders:
        description: "Create zero-byte .con placeholders (true/false)"
        required: true
        default: "true"
  pull_request: {}

jobs:
  validate:
    # Skip PRs from forks (no secrets there)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compute effective config
        id: cfg
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BOX_ID="${{ github.event.inputs.box_folder_id }}"
            PLACEHOLDERS="${{ github.event.inputs.create_placeholders }}"
          else
            BOX_ID="258911132863"   # <-- default for PRs
            PLACEHOLDERS="true"
          fi
          echo "box_folder_id=$BOX_ID" >> "$GITHUB_OUTPUT"
          echo "create_placeholders=$PLACEHOLDERS" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install "boxsdk[jwt]>=3" pandas

      - name: Set up Node (for bids-validator)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install bids-validator
        run: npm install -g bids-validator

      - name: Show effective config
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "BOX_FOLDER_ID: ${{ steps.cfg.outputs.box_folder_id }}"
          echo "CREATE_PLACEHOLDERS: ${{ steps.cfg.outputs.create_placeholders }}"

      - name: Show Python & boxsdk info
        shell: bash
        run: |
          python - <<'PY'
          import sys
          print(sys.version)
          print("\n".join(sys.path))
          try:
              import importlib.util as u
              spec = u.find_spec("boxsdk")
              print("boxsdk spec:", spec)
          except Exception as e:
              print("boxsdk spec check failed:", e)
          PY

      - name: Show installed boxsdk
        shell: bash
        run: |
          python -m pip show boxsdk || true
          python - <<'PY'
          import boxsdk
          print('boxsdk file:', getattr(boxsdk, '__file__', '?'))
          PY

      - name: Run validation script
        env:
          BOX_CLIENT_SDK_CONFIG: ${{ secrets.BOX_CLIENT_SDK_CONFIG }}
          PYTHONUNBUFFERED: "1"
        run: |
          python .github/workflows/validate_box_bids.py \
            --box-folder-id "${{ steps.cfg.outputs.box_folder_id }}" \
            --work-dir datasets \
            --skip-ext .con \
            --skip-ext .fif \
            --skip-ext .mrk \
            --skip-ext .bin \
            --skip-ext .meg4 \
            --skip-ext .ds \
            --skip-ext .dat \
            --skip-ext .mat \
            --skip-ext .edf
