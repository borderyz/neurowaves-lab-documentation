name: BIDS validate (Box via Python)

on:
  workflow_dispatch:
    inputs:
      box_folder_id:
        description: "Box folder ID containing dataset subfolders"
        required: true
        default: "340371145702"
      create_placeholders:
        description: "Create zero-byte .con placeholders (true/false)"
        required: true
        default: "true"

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install boxsdk pandas

      - name: Set up Node (for bids-validator)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install bids-validator
        run: npm install -g bids-validator

      - name: Run validation (Box mode)
        env:
          BOX_CLIENT_SDK_CONFIG: ${{ secrets.BOX_CLIENT_SDK_CONFIG }}
        run: |
          python validate_box_bids.py \
            --box-folder-id "${{ github.event.inputs.box_folder_id }}" \
            --work-dir datasets \
            --reports-dir reports \
            $([ "${{ github.event.inputs.create_placeholders }}" = "true" ] || echo "--no-con-placeholders")
