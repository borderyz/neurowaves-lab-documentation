name: Automated Testing (MNE 1.10 on all OS)

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    name: Test on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11"]  # add "3.12" after this passes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # Use bash everywhere so conditionals are portable
      - name: Upgrade pip tooling
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install test deps (prefer wheels)
        shell: bash
        env:
          PIP_PREFER_BINARY: "1"
          PIP_NO_BUILD_ISOLATION: "0"
        run: |
          python -m pip install "mne==1.10.2" pytest pytest-cov

      - name: Verify MNE and env
        shell: bash
        run: |
          python - <<'PY'
          import sys, mne
          print("Python:", sys.version)
          print("MNE:", mne.__version__)
          PY

      - name: Ensure MEG_DATA exists
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/pipeline/mne_pipelines/kit_general_pipelines"

      - name: Run pytest
        shell: bash
        env:
          MEG_DATA: ${{ github.workspace }}/pipeline/mne_pipelines/kit_general_pipelines
        run: |
          pytest -v tests/

      - name: Upload pytest results (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-logs-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            .pytest_cache/
            **/sanity_check_overview.csv
            **/*.log
