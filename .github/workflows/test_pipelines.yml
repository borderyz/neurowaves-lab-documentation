name: Automated Testing (MNE 1.10 on all OS)

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    name: Test on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt
          pip install mne==1.10 mne-bids pytest pytest-cov

      - name: Verify MNE version
        run: python -c "import mne; print('MNE version:', mne.__version__)"

      - name: Run pytest
        env:
          MEG_DATA: ${{ github.workspace }}/pipeline/mne_pipelines/kit_general_pipelines
        run: |
          pytest -v tests/

      - name: Upload pytest results (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-logs-${{ matrix.os }}
          path: |
            .pytest_cache/
            **/sanity_check_overview.csv
            **/*.log
